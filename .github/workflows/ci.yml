name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo build --release --workspace --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Ensure tmux is installed and its server stays up (steer feature tests need it)
        if: runner.os != 'Windows'
        # `cargo test` runs many tests in parallel, and several spawn a real
        # `tmux new-session` concurrently. If no tmux server exists yet, the
        # very first `new-session` call has to bootstrap one — a race that
        # can make a losing concurrent call fail outright. macos-latest
        # doesn't ship tmux at all, so install it first there; ubuntu-latest
        # already has it. Not run on Windows: those tmux tests are
        # `#[cfg_attr(windows, ignore)]`/module-`cfg(not(windows))`'d out,
        # since tmux has no Windows implementation.
        #
        # `tmux start-server` alone isn't enough: it creates a server with
        # *zero* sessions, and `exit-empty` (a server-wide option, on by
        # default per tmux(1)) exits the whole server the moment the active
        # session count hits zero — which can happen in the gap before the
        # very next command even runs (confirmed live: `tmux set-option`
        # right after `start-server` failed with "no server running").
        # Creating a real, long-lived keepalive session atomically starts
        # the server *with* a session already attached to it, so there's
        # never a zero-session window in the first place — and it stays
        # alive for the rest of the job even as dozens of tests concurrently
        # create and kill their own uniquely-named sessions around it.
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install tmux
            else
              sudo apt-get update && sudo apt-get install -y tmux
            fi
          fi
          tmux new-session -d -s __ci_keepalive__ 'sleep 999999'
          tmux set-option -g exit-empty off
      - run: cargo test --workspace --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - uses: taiki-e/install-action@75a348306ce8f67c0b06fc62c32a8546140ba955 # cargo-llvm-cov
      - name: Start a persistent tmux keepalive session (steer feature tests spawn real tmux sessions)
        # See the matching step/comment in the `test` job: `tmux start-server`
        # alone creates a *zero-session* server, and `exit-empty` (on by
        # default) tears the whole thing down the moment the session count
        # hits zero — which cargo test's parallel execution does constantly,
        # and can even happen before the very next command runs. A real,
        # long-lived keepalive session avoids that zero-session window
        # entirely instead of racing to disable the option in time.
        run: |
          tmux new-session -d -s __ci_keepalive__ 'sleep 999999'
          tmux set-option -g exit-empty off
      - name: Run instrumented tests
        run: cargo llvm-cov --no-report --lib --workspace --locked
      - name: Enforce line-coverage floor
        run: cargo llvm-cov report --summary-only --fail-under-lines 47
      - name: Export lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  security:
    name: Security and extension package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Build and audit VS Code extension
        working-directory: vscode-extension
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
          pnpm run compile
          pnpm run package
          test -f LICENSE
          unzip -l raios-*.vsix | grep -q 'extension/LICENSE'

  installer:
    name: Installer smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Stage Linux or macOS installer
        if: runner.os != 'Windows'
        run: |
          ./install.sh --root "$RUNNER_TEMP/raios-install" --no-restart
          "$RUNNER_TEMP/raios-install/bin/raios" --version
      - name: Stage Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install-system.ps1 -InstallRoot "$env:RUNNER_TEMP\raios-install" -WorkspaceRoot "$env:RUNNER_TEMP\raios-workspace" -NoPath -NoScheduledTask
          & "$env:RUNNER_TEMP\raios-install\bin\raios.exe" --version

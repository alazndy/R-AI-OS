[package]
name = "rwk-core"
description = "UI-independent core of RAIOS Workspace Native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
raios-contracts = { path = "../../../../crates/raios-contracts" }
cap-std = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false }
uuid = { version = "1", features = ["v4"] }
alacritty_terminal = "=0.25.1"
portable-pty = "0.9"
libc = "0.2"
tungstenite = "0.24"
lsp-types = "0.97"
regex = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "lsp_client"
harness = false

[[test]]
name = "lsp_manager"
harness = false

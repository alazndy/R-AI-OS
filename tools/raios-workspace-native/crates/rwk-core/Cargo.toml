[package]
name = "rwk-core"
description = "UI-independent core of RAIOS Workspace Native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
raios-contracts = { path = "../../../../crates/raios-contracts" }
cap-std = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "rwk-app"
description = "The native RAIOS workspace application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rwk-app"
path = "src/main.rs"

[dependencies]
rwk-core = { path = "../rwk-core" }
rwk-ui = { path = "../rwk-ui" }
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
gpui_base = { package = "gpui-base", version = "=0.7.1" }

[dev-dependencies]
tempfile = "3"

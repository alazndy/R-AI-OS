[package]
name = "rwk-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rwk-core = { path = "../rwk-core" }
gpui = { package = "gpui-pre", version = "=0.3.8" }
async-channel = "2"
anyhow = "1"
serde = "1"
serde_json = "1"
gpui_base = { package = "gpui-base", version = "=0.7.1" }
tree-sitter = "0.27"
streaming-iterator = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-r = "1"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1"
tree-sitter-sequel = "0.3"
tree-sitter-xml = "0.7"

[dev-dependencies]
sha2 = "0.10"
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.8" }
raios-contracts = { path = "../../../../crates/raios-contracts" }
tempfile = "3"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["wayland", "x11"] }

[[test]]
name = "view_window"
harness = false

[[test]]
name = "view_headless"

[[test]]
name = "editor_headless"

[[test]]
name = "tree_headless"

[[test]]
name = "workbench_headless"

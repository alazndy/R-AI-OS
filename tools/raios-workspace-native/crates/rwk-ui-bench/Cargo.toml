[package]
name = "rwk-ui-bench"
description = "UI-bound performance gates of the RAIOS Workspace Native terminal view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ui-bench"
path = "src/main.rs"

[dependencies]
rwk-core = { path = "../rwk-core" }
rwk-ui = { path = "../rwk-ui" }
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["wayland", "x11"] }
gpui_base = { package = "gpui-base", version = "=0.7.1" }
async-channel = "2"
tempfile = "3"

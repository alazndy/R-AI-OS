[workspace]
resolver = "2"
members = ["crates/rwk-core", "crates/rwk-bench", "crates/rwk-ui", "crates/rwk-ui-bench", "crates/rwk-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

# A debug build of a GPU toolkit and a terminal emulator is unusably slow; keep our own crates
# quick to rebuild and the dependencies fully optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

overrides:
  # GHSA-qhr7-859c-m2p7: DoS via uncontrolled recursion in parseCommaParts
  # (patched >=5.0.11) and GHSA-6j4f-fj2g-mc7p (patched >=5.0.10), on top of
  # the earlier GHSA-rgw5-rvv9-x895 / GHSA-mh99-v99m-4gvg mitigations.
  # Transitive via @vscode/vsce > glob > minimatch > brace-expansion.
  brace-expansion: 5.0.12
  # GHSA-4cwx-7wf7-3272: cross-user info disclosure + parse-time crash via
  # degenerate private cache directives, patched >=7.29.0.
  # Transitive via @vscode/vsce > cheerio > undici.
  undici: 7.29.0
  # GHSA-7p8r-x3mc-p8w7: host confusion via backslash authority introducer,
  # patched >=3.1.5.
  # Transitive via @vscode/vsce > @secretlint/node > ... > ajv > fast-uri.
  fast-uri: 3.1.5
  # GHSA-5p4m-2wfm-xmqj: quadratic CPU consumption in !!omap resolution,
  # patched >=4.3.1.
  # Transitive via @vscode/vsce > @secretlint/node > ... > js-yaml.
  js-yaml: 4.3.1
  # GHSA-xcx6-jx8p-x3h5: MSAL Node authorization code flow may disclose
  # parameters to an attacker-controlled endpoint, patched >=7.1.0.
  # Transitive via @vscode/vsce > @azure/identity > @azure/msal-node, which
  # only `vsce publish` authentication uses; `vsce package` does not call it.
  # @azure/identity (latest 4.14.0) still asks for ^6, so there is no upstream fix.
  '@azure/msal-node': 7.1.0
  # Patched >=6.16.0. Transitive via @vscode/vsce > typed-rest-client > qs.
  qs: 6.16.0

allowBuilds:
  '@vscode/vsce-sign': false
  keytar: false
ignoredBuiltDependencies:
  # VS Code Marketplace handles extension signing. These optional native helpers
  # are not needed to compile or package the extension and must not run scripts
  # implicitly in local or CI installs.
  - '@vscode/vsce-sign'
  - keytar
